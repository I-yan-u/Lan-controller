plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.lancontrol'
version = '0.1.0'

android {
  namespace "expo.modules.lancontrol"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub on the JVM; tests need the real implementation.
  testImplementation 'org.json:json:20250517'
}
